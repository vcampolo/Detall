// Normalize name for fuzzy matching
function normName(s) {
  return s.toUpperCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Z0-9 ,]/g,'')
    .trim();
}

// Find best match in padron for a given name string
function findBestMatch(nombre) {
  const query = normName(nombre);
  let best = null, bestScore = -1;
  for (const p of PADRON) {
    const target = normName(p.nombre);
    const score = similarity(query, target);
    if (score > bestScore) { bestScore = score; best = p; }
  }
  return bestScore > 0.45 ? best : null;
}

function similarity(a, b) {
  if (a === b) return 1;
  // Token overlap
  const ta = new Set(a.split(/\s+/));
  const tb = new Set(b.split(/\s+/));
  let common = 0;
  for (const t of ta) if (tb.has(t)) common++;
  return (2 * common) / (ta.size + tb.size);
}

function normalizeType(file) {
  const n = file.name.toLowerCase();
  if (file.type && file.type.startsWith('image/')) return file.type;
  if (n.endsWith('.jpg')||n.endsWith('.jpeg')) return 'image/jpeg';
  if (n.endsWith('.png')) return 'image/png';
  if (n.endsWith('.webp')) return 'image/webp';
  if (n.endsWith('.pdf')) return 'application/pdf';
  return 'image/jpeg';
}
async function toBase64(file) {
  return new Promise((res,rej) => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.onerror = () => rej(new Error('Error')); r.readAsDataURL(file); });
}

async function callAPI(b64, mediaType, prompt) {
  const isPDF = mediaType === 'application/pdf';
  const contentBlock = isPDF
    ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: b64 } }
    : { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } };

  const res = await fetch('/api/procesar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      messages: [{ role: 'user', content: [contentBlock, { type: 'text', text: prompt }] }]
    })
  });
  if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(`API ${res.status}: ${err.error?.message||res.statusText}`); }
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const raw = (data.content||[]).map(c=>c.text||'').join('').trim();
  const clean = raw.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
  try { return JSON.parse(clean); }
  catch { const m = clean.match(/\{[\s\S]*\}/); if (m) return JSON.parse(m[0]); throw new Error('No se pudo interpretar la respuesta'); }
}

  const btn = document.getElementById('btnProcesar');
  btn.disabled = true;
  parteResults = [];
  document.getElementById('previewBox').innerHTML = '';
  document.getElementById('errorsBox').innerHTML = '';

  const prompt = buildPrompt();
  const errors = [];

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const pct = Math.round((i / files.length) * 100);
    setStatus(`<div class="spinner"></div><div style="flex:1;">Procesando ${i+1} de ${files.length}: <strong>${f.name}</strong><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`, 'loading');

    try {
      const b64 = await toBase64(f);
      const mediaType = normalizeType(f);
      const parsed = await callAPI(b64, mediaType, prompt);

      // Normalize: ensure all actuaciones have valid num
      const actuaciones = (parsed.actuaciones || []).map(a => {
        let num = parseInt(a.num);
        if (!num || num < 1 || num > 113) {
          // Try name fallback
          if (a.nombre) {
            const match = findBestMatch(a.nombre);
            if (match) num = match.num;
          }
        }
        return num >= 1 && num <= 113 ? { num, codigo: a.codigo } : null;
      }).filter(Boolean);

      parteResults.push({
        nro_parte: parsed.nro_parte || `Parte ${i+1}`,
        fecha: parsed.fecha || '',
        actuaciones
      });
    } catch(e) {
      errors.push({ filename: f.name, error: e.message });
    }
  }

  setStatus('', '');
  btn.disabled = false;

  if (errors.length > 0) {
    document.getElementById('errorsBox').innerHTML = errors.map(e =>
      `<div class="error-card">⚠️ <strong>${e.filename}</strong><div class="error-detail">${e.error}</div></div>`
    ).join('');
  }

  if (parteResults.length > 0) renderPreview();
}

function renderPreview() {
  // Build matrix: matrix[numBombero][colIndex] = codigo
  const matrix = {};
  PADRON.forEach(p => { matrix[p.num] = {}; });
  parteResults.forEach((parte, ci) => {
    parte.actuaciones.forEach(a => {
      if (matrix[a.num] !== undefined) matrix[a.num][ci] = a.codigo;
    });
  });

  // Group by sector for visual separators
  let lastSector = null;
  let tbodyRows = '';
  PADRON.forEach(p => {
    if (p.sector !== lastSector) {
      tbodyRows += `<tr class="sector-row"><td></td><td colspan="${parteResults.length + 1}">${p.sector}</td></tr>`;
      lastSector = p.sector;
    }
    const celdas = parteResults.map((_, ci) => {
      const val = matrix[p.num][ci] || 0;
      const cls = val > 0 ? `v${val}` : 'v0';
      return `<td style="text-align:center;"><select class="num-select ${cls}" data-num="${p.num}" data-col="${ci}" onchange="onSelectChange(this)">
        <option value="0" ${val===0?'selected':''}>—</option>
        <option value="1" ${val===1?'selected':''}>1</option>
        <option value="2" ${val===2?'selected':''}>2</option>
        <option value="3" ${val===3?'selected':''}>3</option>
      </select></td>`;
    }).join('');
    tbodyRows += `<tr>
      <td class="col-num">${p.num}</td>
      <td class="col-nombre">${p.nombre}</td>
      ${celdas}
    </tr>`;
  });

  const theadCols = parteResults.map(p =>
    `<th>${p.nro_parte}<br><span style="font-weight:400;font-size:0.72rem;opacity:0.8;">${p.fecha}</span></th>`
  ).join('');

  document.getElementById('previewBox').innerHTML = `
    <div class="preview-section">
      <div class="preview-header">
        <div>
          <div class="preview-title">Previsualización — ${PADRON.length} bomberos · ${parteResults.length} parte${parteResults.length>1?'s':''}</div>
          <div class="preview-hint">Podés cambiar los valores antes de exportar.</div>
        </div>
        <button class="btn-export" onclick="exportarExcel()">⬇ Exportar Excel</button>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#2e7d32"></div> 1 = Salió a la intervención</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f57f17"></div> 2 = En la dependencia</div>
        <div class="legend-item"><div class="legend-dot" style="background:#1565c0"></div> 3 = Guardia cuartelero</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ccc"></div> vacío = no estaba</div>
      </div>
      <div class="table-wrap">
        <table id="matrixTable">
          <thead><tr>
            <th class="col-num">#</th>
            <th class="col-nombre">Bombero</th>
            ${theadCols}
          </tr></thead>
          <tbody>${tbodyRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function onSelectChange(sel) {
  const val = parseInt(sel.value);
  sel.className = `num-select ${val > 0 ? 'v'+val : 'v0'}`;
  const num = parseInt(sel.dataset.num);
  const ci = parseInt(sel.dataset.col);
  const parte = parteResults[ci];
  const idx = parte.actuaciones.findIndex(a => a.num === num);
  if (val === 0) { if (idx >= 0) parte.actuaciones.splice(idx, 1); }
  else { if (idx >= 0) parte.actuaciones[idx].codigo = val; else parte.actuaciones.push({ num, codigo: val }); }
}

function exportarExcel() {
  const headers = ['#', 'Bombero', ...parteResults.map(p => `${p.nro_parte} — ${p.fecha}`)];
  const table = document.getElementById('matrixTable');
  const rows = table.querySelectorAll('tbody tr:not(.sector-row)');

  let xml = `<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Personal Actuante"><Table>`;
  xml += '<Row>' + headers.map(h => `<Cell><Data ss:Type="String">${esc(h)}</Data></Cell>`).join('') + '</Row>';

  rows.forEach(tr => {
    const num = tr.querySelector('td.col-num') ? tr.querySelector('td.col-num').textContent.trim() : '';
    const nombre = tr.querySelector('td.col-nombre') ? tr.querySelector('td.col-nombre').textContent.trim() : '';
    const selects = tr.querySelectorAll('.num-select');
    xml += '<Row>';
    xml += `<Cell><Data ss:Type="String">${esc(num)}</Data></Cell>`;
    xml += `<Cell><Data ss:Type="String">${esc(nombre)}</Data></Cell>`;
    selects.forEach(sel => {
      const v = parseInt(sel.value);
      xml += v > 0
        ? `<Cell><Data ss:Type="Number">${v}</Data></Cell>`
        : `<Cell><Data ss:Type="String"></Data></Cell>`;
    });
    xml += '</Row>';
  });

  xml += '</Table></Worksheet></Workbook>';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([xml], { type: 'application/vnd.ms-excel' }));
  a.download = 'personal_actuante.xls';
  a.click();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
