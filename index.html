<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detall — Bomberos Voluntarios de Quilmes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --rojo: #c0392b; --rojo-dark: #96281b; --rojo-light: #fadbd8;
      --gris-light: #f4f6f8; --gris-mid: #dde1e7; --verde: #1D9E75;
      --azul-light: #eaf4fd; --text: #1a1a2e; --text-muted: #6b7280;
      --radius: 10px; --shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; color: var(--text); min-height: 100vh; }
    header { background: var(--rojo); color: white; padding: 1.25rem 2rem; display: flex; align-items: center; gap: 1rem; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
    .header-icon { font-size: 2rem; }
    header h1 { font-size: 1.15rem; font-weight: 600; }
    header p { font-size: 0.8rem; opacity: 0.85; margin-top: 2px; }
    .container { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border-radius: var(--radius); box-shadow: var(--shadow); padding: 1.5rem; margin-bottom: 1.25rem; }
    .card-title { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 1rem; }
    .upload-zone { border: 2px dashed var(--gris-mid); border-radius: var(--radius); padding: 2.5rem 1rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--rojo); background: var(--rojo-light); }
    .upload-zone input { display: none; }
    .upload-emoji { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .upload-title { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .upload-sub { font-size: 0.85rem; color: var(--text-muted); }
    .file-list { margin-top: 1rem; display: flex; flex-direction: column; gap: 8px; }
    .file-item { background: var(--gris-light); border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 0.875rem; }
    .file-left { display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .file-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-size { font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0; }
    .file-remove { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; padding: 2px 6px; border-radius: 4px; transition: color 0.15s; flex-shrink: 0; }
    .file-remove:hover { color: var(--rojo); background: var(--rojo-light); }
    .btn-procesar { width: 100%; padding: 14px; background: var(--rojo); color: white; border: none; border-radius: var(--radius); font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-procesar:hover:not(:disabled) { background: var(--rojo-dark); }
    .btn-procesar:active:not(:disabled) { transform: scale(0.99); }
    .btn-procesar:disabled { background: var(--gris-mid); color: var(--text-muted); cursor: not-allowed; }
    .status { padding: 12px 16px; border-radius: 8px; font-size: 0.875rem; margin-top: 1rem; display: flex; align-items: flex-start; gap: 10px; }
    .status-loading { background: var(--azul-light); color: #1565c0; }
    .status-error { background: var(--rojo-light); color: var(--rojo-dark); }
    .spinner { width: 16px; height: 16px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; margin-top: 1px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar { height: 6px; background: var(--gris-mid); border-radius: 999px; margin-top: 10px; overflow: hidden; }
    .progress-fill { height: 100%; background: var(--rojo); border-radius: 999px; transition: width 0.4s ease; }

    /* Preview section */
    .preview-section { margin-top: 1.5rem; }
    .preview-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 1rem; }
    .preview-title { font-size: 1rem; font-weight: 600; }
    .preview-hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .btn-export { padding: 10px 22px; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; background: var(--verde); color: white; transition: background 0.15s; }
    .btn-export:hover { background: #0F6E56; }

    .table-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow); background: white; }
    table { border-collapse: collapse; font-size: 0.82rem; min-width: 100%; }
    thead th { position: sticky; top: 0; background: #2c3e50; color: white; padding: 10px 12px; font-weight: 600; white-space: nowrap; text-align: center; border-right: 1px solid #3d5166; z-index: 2; }
    thead th.col-nombre { text-align: left; min-width: 200px; position: sticky; left: 0; z-index: 3; background: #2c3e50; }
    tbody tr:nth-child(even) { background: var(--gris-light); }
    tbody tr:hover { background: #e8f4fd; }
    tbody td { padding: 7px 10px; border-bottom: 1px solid var(--gris-mid); border-right: 1px solid var(--gris-mid); vertical-align: middle; }
    tbody td.col-nombre { position: sticky; left: 0; background: inherit; font-weight: 500; min-width: 200px; z-index: 1; }
    tbody tr:nth-child(even) td.col-nombre { background: var(--gris-light); }
    tbody tr:hover td.col-nombre { background: #e8f4fd; }
    .nombre-input { width: 100%; border: none; background: transparent; font-size: 0.82rem; font-weight: 500; color: var(--text); padding: 2px 4px; border-radius: 4px; outline: none; font-family: inherit; }
    .nombre-input:focus { background: white; box-shadow: 0 0 0 2px var(--rojo); }
    .num-cell { text-align: center; }
    .num-select { border: 1px solid var(--gris-mid); border-radius: 6px; padding: 3px 6px; font-size: 0.82rem; font-weight: 600; cursor: pointer; background: white; outline: none; width: 60px; text-align: center; }
    .num-select:focus { border-color: var(--rojo); }
    .num-select.v1 { color: #2e7d32; background: #e8f5e9; border-color: #a5d6a7; }
    .num-select.v2 { color: #f57f17; background: #fff8e1; border-color: #ffcc80; }
    .num-select.v3 { color: #1565c0; background: var(--azul-light); border-color: #90caf9; }
    .num-select.v0 { color: var(--text-muted); background: white; }

    .legend { display: flex; gap: 16px; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 12px; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    .error-card { background: var(--rojo-light); border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; color: var(--rojo-dark); margin-top: 1rem; }
    .error-detail { font-size: 0.75rem; opacity: 0.8; margin-top: 3px; }
  </style>
</head>
<body>
<header>
  <div class="header-icon">🚒</div>
  <div>
    <h1>Detall</h1>
    <p>Bomberos Voluntarios de Quilmes — Lector de partes</p>
  </div>
</header>

<div class="container">
  <div class="card">
    <div class="card-title">Archivos del parte</div>
    <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
      <input type="file" id="fileInput" multiple accept="image/*,application/pdf" onchange="handleFiles(this.files)">
      <div class="upload-emoji">📎</div>
      <div class="upload-title">Tocá para subir los partes</div>
      <div class="upload-sub">JPG, PNG, PDF — podés subir varios a la vez</div>
    </div>
    <div class="file-list" id="fileList"></div>
  </div>

  <button class="btn-procesar" id="btnProcesar" onclick="procesar()" disabled>
    🔍 Procesar partes
  </button>

  <div id="statusBox"></div>
  <div id="errorsBox"></div>
  <div id="previewBox"></div>
</div>

<script>
let files = [];
// Matrix: { bomberos: [{nombre}], partes: [{nro, fecha, actuaciones: {nombre: codigo}}] }
let matrixData = null;

const zone = document.getElementById('uploadZone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });

function handleFiles(newFiles) { for (const f of newFiles) files.push(f); renderFileList(); document.getElementById('btnProcesar').disabled = files.length === 0; }
function formatSize(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b/1024).toFixed(1)+' KB'; return (b/1048576).toFixed(1)+' MB'; }

function renderFileList() {
  document.getElementById('fileList').innerHTML = files.map((f,i) => `
    <div class="file-item">
      <div class="file-left"><span>${f.type.includes('pdf')?'📄':'🖼️'}</span><span class="file-name">${f.name}</span></div>
      <div style="display:flex;align-items:center;gap:8px;"><span class="file-size">${formatSize(f.size)}</span><button class="file-remove" onclick="removeFile(${i})">✕</button></div>
    </div>`).join('');
}
function removeFile(i) { files.splice(i,1); renderFileList(); document.getElementById('btnProcesar').disabled = files.length===0; }

function normalizeType(file) {
  const n = file.name.toLowerCase();
  if (file.type && file.type.startsWith('image/')) return file.type;
  if (n.endsWith('.jpg')||n.endsWith('.jpeg')) return 'image/jpeg';
  if (n.endsWith('.png')) return 'image/png';
  if (n.endsWith('.webp')) return 'image/webp';
  if (n.endsWith('.pdf')) return 'application/pdf';
  return 'image/jpeg';
}

async function toBase64(file) {
  return new Promise((res,rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('Error leyendo archivo'));
    r.readAsDataURL(file);
  });
}

function setStatus(html, type) {
  document.getElementById('statusBox').innerHTML = html ? `<div class="status status-${type}">${html}</div>` : '';
}

async function callAPI(b64, mediaType, prompt) {
  const isPDF = mediaType === 'application/pdf';
  const contentBlock = isPDF
    ? { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: b64 } }
    : { type: 'image', source: { type: 'base64', media_type: mediaType, data: b64 } };

  const res = await fetch('/api/procesar', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 4000,
      messages: [{ role: 'user', content: [contentBlock, { type: 'text', text: prompt }] }]
    })
  });

  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    throw new Error(`API ${res.status}: ${err.error?.message||res.statusText}`);
  }
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  const raw = (data.content||[]).map(c=>c.text||'').join('').trim();
  const clean = raw.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
  try { return JSON.parse(clean); }
  catch {
    const m = clean.match(/\{[\s\S]*\}/);
    if (m) return JSON.parse(m[0]);
    throw new Error('No se pudo interpretar la respuesta JSON');
  }
}

const PROMPT_PADRON = `Sos un asistente especializado en leer partes de personal de bomberos voluntarios argentinos.
Del parte en la imagen, extraé DOS cosas en formato JSON puro sin backticks:

{
  "nro_parte": "string",
  "fecha": "DD/MM/AAAA",
  "padron": [
    {"numero": 1, "nombre": "APELLIDO, Nombre"}
  ],
  "actuaciones": [
    {"nombre": "APELLIDO, Nombre", "codigo": 1}
  ]
}

Reglas para "padron": incluí TODOS los bomberos listados en el parte, en orden, con su número de lista (del 1 al fin). Incluí jefes, oficiales, suboficiales, cabos, bomberos y la sección "Otros" (cuarteleros/telefonistas).

Reglas para "actuaciones": solo los que tienen marca:
- codigo 1 = X (acudió a la intervención)
- codigo 2 = • (estaba en la dependencia, no salió)
- codigo 3 = G (guardia cuartelero)

Respondé SOLO con el JSON, sin texto extra.`;

const PROMPT_SOLO_ACTUACIONES = `Sos un asistente especializado en leer partes de personal de bomberos voluntarios argentinos.
Del parte en la imagen, extraé en formato JSON puro sin backticks:

{
  "nro_parte": "string",
  "fecha": "DD/MM/AAAA",
  "actuaciones": [
    {"nombre": "APELLIDO, Nombre", "codigo": 1}
  ]
}

Reglas:
- codigo 1 = X (acudió a la intervención)
- codigo 2 = • (estaba en la dependencia, no salió)
- codigo 3 = G (guardia cuartelero)
- Solo incluir quienes tienen marca. En blanco = no incluir.

Respondé SOLO con el JSON, sin texto extra.`;

async function procesar() {
  const btn = document.getElementById('btnProcesar');
  btn.disabled = true;
  matrixData = null;
  document.getElementById('previewBox').innerHTML = '';
  document.getElementById('errorsBox').innerHTML = '';

  const results = [];
  const errors = [];
  let padron = null;

  for (let i = 0; i < files.length; i++) {
    const f = files[i];
    const pct = Math.round((i / files.length) * 100);
    setStatus(`
      <div class="spinner"></div>
      <div style="flex:1;">
        Procesando ${i+1} de ${files.length}: <strong>${f.name}</strong>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>
    `, 'loading');

    try {
      const b64 = await toBase64(f);
      const mediaType = normalizeType(f);
      const prompt = (i === 0) ? PROMPT_PADRON : PROMPT_SOLO_ACTUACIONES;
      const parsed = await callAPI(b64, mediaType, prompt);

      if (i === 0 && parsed.padron && parsed.padron.length > 0) {
        padron = parsed.padron;
      }

      results.push({
        nro_parte: parsed.nro_parte || `Parte ${i+1}`,
        fecha: parsed.fecha || '',
        actuaciones: parsed.actuaciones || []
      });

    } catch(e) {
      errors.push({ filename: f.name, error: e.message });
    }
  }

  setStatus('', '');
  btn.disabled = false;

  if (errors.length > 0) {
    document.getElementById('errorsBox').innerHTML = errors.map(e => `
      <div class="error-card">⚠️ <strong>${e.filename}</strong><div class="error-detail">${e.error}</div></div>
    `).join('');
  }

  if (results.length > 0 && padron) {
    matrixData = { padron, partes: results };
    renderPreview();
  } else if (results.length > 0 && !padron) {
    document.getElementById('errorsBox').innerHTML += `<div class="error-card">⚠️ No se pudo leer el padrón del primer parte. Intentá procesar nuevamente.</div>`;
  }
}

function colKey(parte) {
  return `${parte.nro_parte}__${parte.fecha}`;
}

function renderPreview() {
  if (!matrixData) return;
  const { padron, partes } = matrixData;

  // Build lookup: nombre -> codigo per parte
  const lookup = {}; // lookup[nombre][colKey] = codigo
  partes.forEach(p => {
    const key = colKey(p);
    (p.actuaciones || []).forEach(a => {
      const nombre = a.nombre.toUpperCase().trim();
      if (!lookup[nombre]) lookup[nombre] = {};
      lookup[nombre][key] = a.codigo;
    });
  });

  const colKeys = partes.map(colKey);

  let html = `
    <div class="preview-section">
      <div class="preview-header">
        <div>
          <div class="preview-title">Previsualización — ${padron.length} bomberos · ${partes.length} parte${partes.length>1?'s':''}</div>
          <div class="preview-hint">Podés editar los nombres y cambiar los valores antes de exportar.</div>
        </div>
        <button class="btn-export" onclick="exportarExcel()">⬇ Exportar Excel</button>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#2e7d32"></div> 1 = Salió a la intervención</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f57f17"></div> 2 = En la dependencia</div>
        <div class="legend-item"><div class="legend-dot" style="background:#1565c0"></div> 3 = Guardia cuartelero</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ccc"></div> vacío = no estaba</div>
      </div>

      <div class="table-wrap">
        <table id="matrixTable">
          <thead>
            <tr>
              <th class="col-nombre">Bombero</th>
              ${partes.map(p => `<th class="parte-col">${p.nro_parte}<br><span style="font-weight:400;font-size:0.72rem;opacity:0.8;">${p.fecha}</span></th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${padron.map((b, bi) => {
              const nombreUpper = b.nombre.toUpperCase().trim();
              const celdas = colKeys.map((ck, ci) => {
                const val = lookup[nombreUpper] ? (lookup[nombreUpper][ck] || 0) : 0;
                const cls = val > 0 ? `v${val}` : 'v0';
                return `<td class="num-cell">
                  <select class="num-select ${cls}" data-row="${bi}" data-col="${ci}" onchange="onSelectChange(this)">
                    <option value="0" ${val===0?'selected':''}>—</option>
                    <option value="1" ${val===1?'selected':''}>1</option>
                    <option value="2" ${val===2?'selected':''}>2</option>
                    <option value="3" ${val===3?'selected':''}>3</option>
                  </select>
                </td>`;
              }).join('');
              return `<tr>
                <td class="col-nombre">
                  <input class="nombre-input" type="text" value="${b.nombre}" data-row="${bi}" onchange="onNombreChange(this)">
                </td>
                ${celdas}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('previewBox').innerHTML = html;
}

function onSelectChange(sel) {
  const val = parseInt(sel.value);
  sel.className = `num-select ${val > 0 ? 'v'+val : 'v0'}`;
  const bi = parseInt(sel.dataset.row);
  const ci = parseInt(sel.dataset.col);
  matrixData.partes[ci].actuaciones = matrixData.partes[ci].actuaciones || [];
  const nombre = matrixData.padron[bi].nombre;
  const nombreUpper = nombre.toUpperCase().trim();
  const existing = matrixData.partes[ci].actuaciones.findIndex(a => a.nombre.toUpperCase().trim() === nombreUpper);
  if (val === 0) {
    if (existing >= 0) matrixData.partes[ci].actuaciones.splice(existing, 1);
  } else {
    if (existing >= 0) matrixData.partes[ci].actuaciones[existing].codigo = val;
    else matrixData.partes[ci].actuaciones.push({ nombre, codigo: val });
  }
}

function onNombreChange(input) {
  const bi = parseInt(input.dataset.row);
  matrixData.padron[bi].nombre = input.value;
}

function exportarExcel() {
  if (!matrixData) return;
  const { padron, partes } = matrixData;

  // Headers
  const headers = ['Bombero', ...partes.map(p => `${p.nro_parte} — ${p.fecha}`)];

  // Lookup from current DOM selects
  const table = document.getElementById('matrixTable');
  const rows = table.querySelectorAll('tbody tr');

  let xml = `<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Personal Actuante"><Table>`;

  // Header row
  xml += '<Row>' + headers.map(h => `<Cell><Data ss:Type="String">${esc(h)}</Data></Cell>`).join('') + '</Row>';

  // Data rows
  rows.forEach((tr, bi) => {
    const nombreInput = tr.querySelector('.nombre-input');
    const nombre = nombreInput ? nombreInput.value : padron[bi].nombre;
    const selects = tr.querySelectorAll('.num-select');
    xml += '<Row>';
    xml += `<Cell><Data ss:Type="String">${esc(nombre)}</Data></Cell>`;
    selects.forEach(sel => {
      const v = parseInt(sel.value);
      if (v > 0) xml += `<Cell><Data ss:Type="Number">${v}</Data></Cell>`;
      else xml += `<Cell><Data ss:Type="String"></Data></Cell>`;
    });
    xml += '</Row>';
  });

  xml += '</Table></Worksheet></Workbook>';

  const blob = new Blob([xml], { type: 'application/vnd.ms-excel' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'personal_actuante.xls';
  a.click();
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
